<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>For You 💖</title>

<style>
body {
  margin: 0;
  font-family: "Courier New", monospace;
  color: #00ffcc;
  background: black;
  overflow: hidden;
}

/* 🌸 BACKGROUND IMAGE */
.backdrop {
  position: fixed;
  inset: 0;
  background: url("QA.jpeg") center / cover no-repeat;
  filter: blur(4px) brightness(0.5);
  z-index: -1;
}

/* 💻 CONTENT */
.container {
  padding: 20px;
  text-shadow: 0 0 10px #00ffcc;
}

/* 💕 BUTTONS */
button {
  background: transparent;
  color: #00ffcc;
  border: 1px solid #00ffcc;
  padding: 12px 22px;
  font-size: 18px;
  margin: 12px;
  border-radius: 10px;
}

/* 💖 HEARTS */
.heart {
  position: fixed;
  bottom: -20px;
  animation: float 6s linear infinite;
}

@keyframes float {
  to {
    transform: translateY(-120vh);
    opacity: 0;
  }
}

/* 💌 MESSAGE */
#loveMsg {
  display: none;
  color: #ff69b4;
  font-size: 20px;
  margin-top: 20px;
}
</style>
</head>

<body>

<div class="backdrop"></div>

<!-- 🎵 MUSIC (NO AUTOPLAY – IPHONE SAFE) -->
<audio id="music" loop preload="auto">
  <source src="Raabta.mp3" type="audio/mpeg">
</audio>

<div class="container">
  <p>💗 Hey Arefa…</p>
  <p>I’ve been meaning to ask you something very special ✨</p>

  <h2>💘 Will you be my Valentine? 💘</h2>

  <button id="yesBtn">YES 💕</button>
  <button id="noBtn">NO 🙈</button>

  <div id="loveMsg">
    💖 Yayyy!! You just made my heart the happiest ❤️  
  </div>
</div>

<script>
const music = document.getElementById("music");
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const loveMsg = document.getElementById("loveMsg");

/* 🎵 START MUSIC ON FIRST TAP (IPHONE RULE) */
function startMusic() {
  music.play().catch(() => {});
}

/* 💖 YES CLICK */
yesBtn.addEventListener("click", () => {
  startMusic();
  loveMsg.style.display = "block";
  yesBtn.disabled = true;
  noBtn.style.display = "none";
  launchHearts();

  setTimeout(() => {
    const msg = encodeURIComponent("I said YES 💖🥺");
    window.location.href = "https://wa.me/918238515858?text=" + msg;
  }, 3000);
});

/* 😜 NO BUTTON RUNS */
noBtn.addEventListener("click", () => {
  startMusic();
  noBtn.style.position = "absolute";
  noBtn.style.left = Math.random() * 80 + "%";
  noBtn.style.top = Math.random() * 80 + "%";
});

/* 💕 FLOATING HEARTS */
function launchHearts() {
  setInterval(() => {
    const h = document.createElement("div");
    h.className = "heart";
    h.innerHTML = Math.random() > 0.5 ? "💖" : "💘";
    h.style.left = Math.random() * 100 + "vw";
    h.style.fontSize = Math.random() * 20 + 16 + "px";
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 6000);
  }, 300);
}
</script>

</body>
</html>
